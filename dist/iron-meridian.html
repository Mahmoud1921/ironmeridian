<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Saira+Stencil+One&display=swap">
<style>
/* Iron Meridian — war-room console. Layout: full-bleed map, command bar on top,
   dossier panels docked left/right, army tray along the bottom. */
:root {
  --ink: #0e1210;
  --panel: #171c19;
  --panel-2: #1f2621;
  --panel-3: #283029;
  --line: #3a443b;
  --line-soft: #2c342d;
  --brass: #c9a55a;
  --brass-dim: #8c7442;
  --paper: #ebe3c9;
  --muted: #9ea393;
  --faint: #6d7466;
  --olive: #7f8e55;
  --good: #7bb865;
  --warn: #d9b24a;
  --bad: #cf5443;
  --info: #7aa6cf;
  --display: "Saira Stencil One", "Stencil", "Barlow Semi Condensed", Impact, sans-serif;
  --ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--paper); font: 15px/1.35 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
#map.targeting { cursor: crosshair; }

/* ---------- panels ---------- */
.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  box-shadow: 0 6px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 4px 12px; border: 1px solid var(--line); background: var(--panel-3);
  color: var(--paper); cursor: pointer; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; font-weight: 600;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: #333d34; border-color: var(--brass-dim); }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.btn.primary { background: #6b5a2c; border-color: var(--brass); color: #fff6dc; }
.btn.primary:hover { background: #7d6a35; }
.btn.danger { background: #5a2520; border-color: #8f3a30; }
.btn.danger:hover { background: #6e2d27; }
.btn.active { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { min-height: 26px; padding: 2px 8px; font-size: 12px; }
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .04em; }

/* ---------- top bar ---------- */
#topbar {
  position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 20;
  display: flex; align-items: stretch; gap: 0; height: 52px;
  background: linear-gradient(180deg, #252c26, #161b17); border-bottom: 1px solid #000; box-shadow: 0 3px 12px rgba(0,0,0,.5);
}
#tb-nation { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 8px; border-right: 1px solid var(--line); cursor: pointer; background: none; border-top: 0; border-bottom: 0; border-left: 0; }
#tb-nation .flag { width: 54px; height: 36px; }
#tb-nation .nm { font-family: var(--display); font-size: 17px; line-height: 1; white-space: nowrap; }
#tb-nation .gov { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
#tb-stats { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
#tb-stats::-webkit-scrollbar { display: none; }
.stat { display: flex; flex-direction: column; justify-content: center; padding: 0 12px; border-right: 1px solid var(--line-soft); min-width: 74px; }
.stat .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
.stat .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat.warn .v { color: var(--warn); }
.stat.bad .v { color: var(--bad); }
#tb-clock { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-left: 1px solid var(--line); }
#tb-date { font-family: var(--display); font-size: 16px; min-width: 196px; text-align: center; white-space: nowrap; }
#tb-speed { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
#tb-speed i { width: 5px; background: var(--line); display: block; }
#tb-speed i.on { background: var(--brass); }
.iconbtn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel-3); cursor: pointer; color: var(--paper); }
.iconbtn:hover { border-color: var(--brass-dim); }
.iconbtn svg { width: 16px; height: 16px; }
#tb-play.paused { background: #5a2520; border-color: #8f3a30; }
#tb-menu { margin: 0 8px; align-self: center; }

/* ---------- side panels ---------- */
#leftpanel { position: absolute; left: 10px; top: 62px; width: 300px; max-height: calc(100% - 200px); overflow-y: auto; z-index: 15; padding: 12px 14px; }
#rightpanel { position: absolute; right: 10px; top: 62px; width: 330px; max-height: calc(100% - 200px); z-index: 15; display: flex; flex-direction: column; }
#rp-tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 8px 4px; background: none; border: 0; border-right: 1px solid var(--line-soft); cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.tab:last-child { border-right: 0; }
.tab.on { color: var(--paper); background: var(--panel-3); box-shadow: inset 0 -2px 0 var(--brass); }
.tab .badge { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 3px; background: var(--bad); color: #fff; font-size: 10px; border-radius: 8px; }
#rp-body { overflow-y: auto; padding: 12px 14px; }
.close { float: right; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 4px; }
.close:hover { color: var(--paper); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.sep { border: 0; border-top: 1px solid var(--line-soft); margin: 10px 0; }
.owner { display: flex; align-items: center; gap: 8px; }
.owner .flag { width: 30px; height: 20px; }
.flag { width: 30px; height: 20px; display: block; border: 1px solid rgba(0,0,0,.6); box-shadow: 0 1px 2px rgba(0,0,0,.5); flex: none; }
.pill { display: inline-block; padding: 1px 7px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); }
.pill.war { color: #ffd9d2; border-color: var(--bad); background: rgba(207,84,67,.2); }
.pill.ally { color: #d9f0cf; border-color: var(--good); background: rgba(123,184,101,.15); }
.pill.self { color: #fff0c8; border-color: var(--brass); background: rgba(201,165,90,.15); }
.bar { height: 7px; background: #0c0f0d; border: 1px solid #000; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
.bar.str > i { background: var(--good); }
.bar.org > i { background: var(--warn); }
.bar.sup > i { background: var(--info); }
.bar.prog > i { background: var(--brass); }
.meter { display: grid; grid-template-columns: 84px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
.meter span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.orders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; }
.list { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: rgba(255,255,255,.025); border: 1px solid var(--line-soft); }
.row .grow { flex: 1; min-width: 0; }
.row .sub { font-size: 12px; color: var(--muted); }
.row.click { cursor: pointer; }
.row.click:hover { border-color: var(--brass-dim); }
.search { width: 100%; padding: 7px 9px; background: var(--ink); border: 1px solid var(--line); color: var(--paper); font: inherit; margin-bottom: 8px; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0; }
.unitgrid { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; color: var(--muted); }

/* ---------- bottom tray ---------- */
#bottombar { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#armytray, #unittray { pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; padding: 6px; scrollbar-width: thin; }
#armytray:empty, #unittray:empty { display: none; }
.acard { flex: none; width: 150px; padding: 6px 8px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.acard:hover { border-color: var(--brass-dim); }
.acard.sel { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); background: #2a2f22; }
.acard .t { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.acard .t span:first-child { overflow: hidden; text-overflow: ellipsis; }
.acard .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard .bar { height: 4px; }
.ucard { flex: none; width: 92px; padding: 5px 6px; background: var(--panel); border: 1px solid var(--line-soft); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.ucard svg { width: 30px; height: 20px; }
.ucard .bar { height: 4px; }

/* ---------- map controls ---------- */
#mapctl { position: absolute; right: 10px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 14; display: flex; flex-direction: column; gap: 4px; }
#mapctl .btn { min-width: 40px; }
#hint { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 25; padding: 8px 14px; background: rgba(20,24,20,.95); border: 1px solid var(--brass); font-size: 14px; }

/* ---------- toasts ---------- */
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: 62px; z-index: 18; display: flex; flex-direction: column; gap: 5px; align-items: center; pointer-events: none; width: min(460px, calc(100% - 32px)); }
.toast { pointer-events: auto; cursor: pointer; padding: 7px 12px; background: rgba(23,28,25,.96); border: 1px solid var(--line); border-left: 4px solid var(--info); font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.5); animation: tin .25s ease-out; width: 100%; }
.toast.war, .toast.loss, .toast.cap { border-left-color: var(--bad); }
.toast.win { border-left-color: var(--good); }
.toast.battle { border-left-color: var(--warn); }
.toast .d { font-size: 11px; color: var(--muted); margin-right: 6px; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* ---------- battle popup ---------- */
#battle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; width: min(560px, calc(100% - 32px)); padding: 14px 16px; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.vs .side h3 { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.vs .mid { font-family: var(--display); font-size: 22px; color: var(--brass); padding-top: 18px; }
.tug { height: 14px; background: linear-gradient(90deg, #5c2a24, #2b4a26); border: 1px solid #000; position: relative; margin: 12px 0 4px; }
.tug i { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff3c8; box-shadow: 0 0 6px #fff3c8; }
.mods { font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.mods .pos { color: var(--good); } .mods .neg { color: var(--bad); }

/* ---------- start screen ---------- */
#start { position: absolute; inset: 0; z-index: 40; display: grid; grid-template-columns: 340px 1fr 380px; pointer-events: none; }
#start > * { pointer-events: auto; }
#st-left { background: linear-gradient(90deg, rgba(14,18,16,.97), rgba(14,18,16,.9)); border-right: 1px solid var(--line); padding: 22px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
#st-right { grid-column: 3; background: linear-gradient(270deg, rgba(14,18,16,.97), rgba(14,18,16,.9)); border-left: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
#st-title { font-family: var(--display); font-size: 42px; line-height: .95; letter-spacing: .03em; color: var(--paper); }
#st-title small { display: block; font-family: var(--ui); font-size: 13px; letter-spacing: .3em; color: var(--brass); margin-top: 8px; }
.majors { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ncard { display: flex; align-items: center; gap: 8px; padding: 7px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; text-align: left; }
.ncard:hover { border-color: var(--brass-dim); }
.ncard.sel { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.ncard .flag { width: 30px; height: 20px; }
.ncard b { font-weight: 600; font-size: 14px; line-height: 1.1; }
.ncard small { display: block; font-size: 11px; color: var(--muted); }
#st-all { display: flex; flex-direction: column; gap: 3px; }
#st-flag { width: 150px; height: 100px; }
#st-name { font-family: var(--display); font-size: 34px; line-height: 1; }
.diff { display: flex; gap: 3px; }
.diff i { width: 18px; height: 6px; background: var(--line); display: block; }
.diff i.on { background: var(--brass); }
.bignums { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); }
.bignums div { background: var(--panel); padding: 8px 10px; }
.bignums b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.bignums span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.res { display: flex; flex-wrap: wrap; gap: 5px; }
.res span { padding: 2px 7px; border: 1px solid var(--line); font-size: 12px; font-variant-numeric: tabular-nums; }
#st-play { min-height: 48px; font-size: 18px; letter-spacing: .2em; }
#loading { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: var(--ink); }
#loading .display { font-size: 38px; }

/* ---------- modal ---------- */
#modal { position: absolute; inset: 0; z-index: 50; background: rgba(5,7,6,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .panel { width: min(440px, 100%); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--brass); width: 16px; height: 16px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  #start { grid-template-columns: 300px 1fr 330px; }
}
@media (max-width: 820px) {
  #topbar { height: auto; flex-wrap: wrap; }
  #tb-nation { height: 48px; }
  #tb-clock { flex: 1; justify-content: flex-end; height: 48px; }
  #tb-menu { height: 34px; }
  #tb-stats { order: 3; flex-basis: 100%; height: 40px; border-top: 1px solid var(--line-soft); }
  #leftpanel { top: 100px; }
  #toasts { top: 100px; }
  #hint { top: 100px; }
  #leftpanel { width: auto; right: 10px; max-height: 42%; }
  #rightpanel { width: auto; left: 10px; top: auto; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); max-height: 48%; }
  #tb-date { min-width: 0; font-size: 13px; }
  #tb-nation .nm, #tb-nation .gov { display: none; }
  .stat { min-width: auto; padding: 0 9px; }
  .stat .v { font-size: 15px; }
  #tb-speed { display: none; }
  #tb-nation { padding: 0 8px; }
  #tb-clock { padding: 0 6px; gap: 4px; }
  #tb-menu { margin: 0 6px; }
  #start { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; pointer-events: auto; background: rgba(14,18,16,.9); }
  #st-left, #st-right { grid-column: 1; border: 0; overflow: visible; }
  #st-map-gap { display: none; }
  #mapctl { bottom: auto; top: 100px; flex-direction: row; right: 10px; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="World map"></canvas>

  <div id="hud" hidden>
    <header id="topbar">
      <button id="tb-nation" aria-label="Go to capital"></button>
      <div id="tb-stats"></div>
      <div id="tb-clock">
        <button class="iconbtn" id="tb-slower" aria-label="Slower"><svg viewBox="0 0 16 16"><path d="M3 7h10v2H3z" fill="currentColor"/></svg></button>
        <button class="iconbtn" id="tb-play" aria-label="Resume"></button>
        <button class="iconbtn" id="tb-faster" aria-label="Faster"><svg viewBox="0 0 16 16"><path d="M7 3h2v4h4v2H9v4H7V9H3V7h4z" fill="currentColor"/></svg></button>
        <div id="tb-date" class="num"></div>
        <div id="tb-speed" aria-label="Game speed"></div>
      </div>
      <button class="iconbtn" id="tb-menu" aria-label="Menu"><svg viewBox="0 0 16 16"><path d="M2 3h12v2H2zM2 7h12v2H2zM2 11h12v2H2z" fill="currentColor"/></svg></button>
    </header>

    <aside id="leftpanel" class="panel" hidden></aside>

    <aside id="rightpanel" class="panel">
      <nav id="rp-tabs">
        <button class="tab on" data-tab="army">Army</button>
        <button class="tab" data-tab="recruit">Recruit</button>
        <button class="tab" data-tab="diplo">Nations</button>
        <button class="tab" data-tab="wars">Wars<span class="badge" id="tab-wars-badge" hidden></span></button>
        <button class="tab" data-tab="log">Log</button>
      </nav>
      <div id="rp-body"></div>
    </aside>

    <div id="mapctl">
      <button class="btn sm active" id="mc-pol" title="Political map">Political</button>
      <button class="btn sm" id="mc-ter" title="Terrain map">Terrain</button>
      <button class="btn sm" id="mc-in" aria-label="Zoom in">+</button>
      <button class="btn sm" id="mc-out" aria-label="Zoom out">−</button>
      <button class="btn sm" id="mc-world" title="Show the whole world">World</button>
    </div>

    <footer id="bottombar">
      <div id="unittray" class="panel"></div>
      <div id="armytray" class="panel"></div>
    </footer>
    <div id="toasts" aria-live="polite"></div>
    <div id="hint" hidden></div>
    <div id="battle" class="panel" hidden></div>
  </div>

  <div id="start" hidden>
    <section id="st-left">
      <div id="st-title">IRON<br>MERIDIAN<small>THE WORLD · 1936</small></div>
      <p class="note">Choose a nation to lead. Click a card, or click any country on the map.</p>
      <div class="label">Great powers and contenders</div>
      <div class="majors" id="st-majors"></div>
      <div class="label">All other nations</div>
      <input class="search" id="st-search" placeholder="Search nations" aria-label="Search nations">
      <div id="st-all"></div>
    </section>
    <div id="st-map-gap"></div>
    <section id="st-right">
      <svg id="st-flag"></svg>
      <div id="st-name"></div>
      <div class="label" id="st-gov"></div>
      <div id="st-diff" style="display:flex;align-items:center;gap:10px"></div>
      <div class="bignums" id="st-nums"></div>
      <div class="label">Resources</div>
      <div class="res" id="st-res"></div>
      <div class="label">Starting situation</div>
      <p id="st-sit" style="margin:0"></p>
      <button class="btn primary" id="st-play">Play</button>
    </section>
  </div>

  <div id="modal" hidden></div>
  <div id="loading"><div class="display">IRON MERIDIAN</div><div class="label">Surveying the world…</div></div>
</div>
<script>
// World geography: hand-drawn, simplified coastlines as [lon, lat] pairs.
// Each landmass is one polygon; lakes are holes cut out of land.
'use strict';
const GEO = {};

GEO.landmasses = {
  eurasia: [
    -9.5,38.8, -8.8,37.0, -7.4,37.2, -6.3,36.5, -5.6,36.0, -4.4,36.7, -2.0,36.8, -0.8,37.6, 0.2,38.8, -0.3,39.5,
    0.9,40.8, 3.2,41.9, 3.1,43.1, 4.8,43.4, 6.2,43.1, 7.5,43.8, 8.8,44.4, 10.2,43.9, 10.5,42.9, 11.7,42.1,

// Miller cylindrical projection into "world units" (roughly degrees).
GEO.project = function (lon, lat) {
  const phi = lat * Math.PI / 180;
  const y = 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * phi)) * 180 / Math.PI;
  return [lon, -y];
};
GEO.unproject = function (x, y) {
  const my = -y * Math.PI / 180;
  const phi = (Math.atan(Math.exp(my / 1.25)) - Math.PI / 4) / 0.4;
  return [x, phi * 180 / Math.PI];
};
GEO.haversineKm = function (lon1, lat1, lon2, lat2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
};

    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const TERRAIN = {
  plains:    { name: 'Plains',    atk: 1.00, move: 1.00, armor: 1.0, color: '#9aa56a', pop: 1.0 },
  forest:    { name: 'Forest',    atk: 0.85, move: 0.80, armor: 0.75, color: '#4f6b3e', pop: 0.7 },
  hills:     { name: 'Hills',     atk: 0.80, move: 0.75, armor: 0.85, color: '#a08a5c', pop: 0.7 },
  mountains: { name: 'Mountains', atk: 0.60, move: 0.50, armor: 0.6, color: '#7d6f63', pop: 0.35 },
  desert:    { name: 'Desert',    atk: 0.95, move: 0.85, armor: 1.0, color: '#d2bd84', pop: 0.12 },
  jungle:    { name: 'Jungle',    atk: 0.70, move: 0.60, armor: 0.6, color: '#3d6b45', pop: 0.5 },
  marsh:     { name: 'Marsh',     atk: 0.70, move: 0.55, armor: 0.6, color: '#6b8577', pop: 0.4 },
  tundra:    { name: 'Tundra',    atk: 0.85, move: 0.70, armor: 0.85, color: '#b8bfb6', pop: 0.08 },
  urban:     { name: 'Urban',     atk: 0.70, move: 0.90, armor: 0.7, color: '#8d8a86', pop: 3.0 }
};

const MapGen = (function () {
  const P = GEO.project;

  function polyFromLonLat(arr) {
    const pts = [];
    for (let i = 0; i < arr.length; i += 2) { const p = P(arr[i], arr[i + 1]); pts.push(p[0], p[1]); }
    return pts;
  }
  function bboxOf(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < pts.length; i += 2) {
      if (pts[i] < x0) x0 = pts[i]; if (pts[i] > x1) x1 = pts[i];
      if (pts[i + 1] < y0) y0 = pts[i + 1]; if (pts[i + 1] > y1) y1 = pts[i + 1];
    }
    return [x0, y0, x1, y1];
  }
  function pip(pts, x, y) {
    let inside = false;
    for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
      const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // Desired province spacing (world units) by region.
  function spacing(lon, lat) {
    if (lon > -11 && lon < 42 && lat > 35 && lat < 62) return 1.45;
    if (lat > 68) return 5.0;
    if (lon > 42 && lon < 146 && lat > -11 && lat < 56) return 2.7;
    if (lon > -125 && lon < -66 && lat > 25 && lat < 50) return 2.9;
    return 3.6;
  }

  function andesLon(lat) {
    const pts = [[10, -73], [5, -75.5], [-5, -78.5], [-10, -76.5], [-17, -69], [-25, -68], [-33, -70], [-45, -72], [-55, -71]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [la, lo] = pts[i], [lb, lob] = pts[i + 1];
      if (lat <= la && lat >= lb) return lo + (lob - lo) * (la - lat) / (la - lb);
    }
    return null;
  }

  function terrainAt(lon, lat, rnd) {
    const inB = (a, b, c, d) => lon >= a && lon <= b && lat >= c && lat <= d;
    if (inB(24, 30.5, 51, 52.8) || inB(29, 32, 6, 9.5)) return 'marsh';
    const al = andesLon(lat);
    if (al !== null && Math.abs(lon - al) < 2.6 && lat < 10 && lat > -52) return 'mountains';
    if (inB(6, 14, 45.6, 47.6) || inB(-1.5, 2.5, 42.3, 43) || inB(39, 48, 41.8, 43.6) || inB(75, 99, 28, 36) ||
        inB(68, 76, 34, 39.5) || inB(74, 88, 41, 43.8) || inB(98, 104, 24, 33) || inB(36.5, 40.5, 7.5, 13.5) ||
        inB(-121, -105, 36, 49) || inB(-130, -116, 49, 60) || inB(46, 54, 29.5, 34.5) || inB(-6.5, 1, 31, 33.5)) return 'mountains';
    if (inB(-17, 33, 16, 30.5) || inB(35, 58, 16, 30) || inB(53, 66, 37, 46) || inB(69, 73, 24, 29) ||
        inB(78, 112, 37, 45) || inB(118, 146, -30, -19) || inB(-117, -108, 31, 37) || inB(-71, -68, -27, -18) ||
        inB(14, 24, -27, -19) || inB(42, 51, 2, 11) || inB(92, 105, 36, 42)) return 'desert';
    if (inB(-75, -45, -12, 5) || inB(10, 30, -6, 5) || inB(-13, 10, 4, 8) || inB(95, 110, 8, 22) ||
        inB(95, 155, -10, 8) || inB(-92, -77, 7, 18)) return 'jungle';
    if (lat > 66 || (lat > 60 && lon > 95) || (lat > 58 && lon < -60 && lon > -170)) return 'tundra';
    if (inB(18, 27, 42, 48.5) || inB(38, 44.5, 37, 41) || inB(26, 38, 37, 40) || inB(56, 61, 51, 66) ||
        inB(-83, -76, 35, 41) || inB(130, 142, 33, 42)) return rnd < 0.6 ? 'hills' : 'forest';
    if ((lat > 52 && lat < 66 && lon > 28) || (lat > 48 && lat < 60 && lon < -55 && lon > -135) || (lat > 58 && lon > 5 && lon < 32))
      return rnd < 0.75 ? 'forest' : (rnd < 0.85 ? 'marsh' : 'plains');
    if (inB(-95, -68, 30, 47)) return rnd < 0.45 ? 'forest' : (rnd < 0.6 ? 'hills' : 'plains');
    if (rnd < 0.18) return 'hills';
    if (rnd < 0.32) return 'forest';
    return 'plains';
  }

  // Clip convex polygon (array of {x,y,n}) to the half-plane nearer s than q.
  function clipHalf(poly, sx, sy, qx, qy, qi) {
    const nx = qx - sx, ny = qy - sy, mx = (sx + qx) / 2, my = (sy + qy) / 2;
    const out = [];
    const n = poly.length;
    for (let i = 0; i < n; i++) {
      const c = poly[i], d = poly[(i + 1) % n];
      const fc = (c.x - mx) * nx + (c.y - my) * ny;
      const fd = (d.x - mx) * nx + (d.y - my) * ny;
      if (fc <= 0) {
        out.push(c);
        if (fd > 0) { const t = fc / (fc - fd); out.push({ x: c.x + (d.x - c.x) * t, y: c.y + (d.y - c.y) * t, n: qi }); }
      } else if (fd <= 0) {
        const t = fc / (fc - fd); out.push({ x: c.x + (d.x - c.x) * t, y: c.y + (d.y - c.y) * t, n: c.n });
      }
    }
    return out;
  }

  function generate() {
    const t0 = performance.now();
    const rnd = mulberry32(MAP_SEED);
    const lms = [];
    for (const key in GEO.landmasses) {
      const pts = polyFromLonLat(GEO.landmasses[key]);
      lms.push({ key, pts, bbox: bboxOf(pts) });
    }
    const lakes = GEO.lakes.map(l => { const pts = polyFromLonLat(l); return { pts, bbox: bboxOf(pts) }; });

    function landmassAt(x, y) {
      for (const l of lakes) if (x >= l.bbox[0] && x <= l.bbox[2] && y >= l.bbox[1] && y <= l.bbox[3] && pip(l.pts, x, y)) return -1;
      for (let i = 0; i < lms.length; i++) {
        const b = lms[i].bbox;
        if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3] && pip(lms[i].pts, x, y)) return i;
      }
      return -1;
    }

    // --- seeds ---
    const seeds = []; // {x,y,lm,city,tag,capital}
    const GRID = 2;
    const grid = new Map();
    const gkey = (gx, gy) => gx * 100000 + gy;
    function addSeed(s) { seeds.push(s); const k = gkey(Math.floor(s.x / GRID), Math.floor(s.y / GRID)); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(s); }
    function nearestSeedDist(x, y, maxR) {
      const r = Math.ceil(maxR / GRID); const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID);
      let best = Infinity;
      for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {
        const arr = grid.get(gkey(gx + i, gy + j)); if (!arr) continue;
        for (const s of arr) { const d = Math.hypot(s.x - x, s.y - y); if (d < best) best = d; }
      }
      return best;
    }
    function snapToLand(x, y) {
      let lm = landmassAt(x, y);
      if (lm >= 0) return [x, y, lm];
      for (let r = 0.25; r <= 2.5; r += 0.25) {
        for (let a = 0; a < 16; a++) {
          const xx = x + Math.cos(a * Math.PI / 8) * r, yy = y + Math.sin(a * Math.PI / 8) * r;
          lm = landmassAt(xx, yy);
          if (lm >= 0) return [xx, yy, lm];
        }
      }
      return null;
    }

    // City anchors (also ownership anchors)
    const anchors = [];
    for (const c of COUNTRY_DEFS) {
      c.cities.forEach((ct, idx) => {
        const p = P(ct[1], ct[2]);
        const s = snapToLand(p[0], p[1]);
        if (!s) return;
        anchors.push({ x: s[0], y: s[1], lm: s[2], tag: c.tag, name: ct[0], capital: idx === 0, lon: ct[1], lat: ct[2] });
      });
    }
    // capitals first, then other cities, so capitals always become seeds
    anchors.sort((a, b) => (b.capital ? 1 : 0) - (a.capital ? 1 : 0));
    for (const a of anchors) {
      const r = spacing(a.lon, a.lat);
      if (nearestSeedDist(a.x, a.y, r) < r * 0.55) continue;
      addSeed({ x: a.x, y: a.y, lm: a.lm, city: a.name, capital: a.capital, cityTag: a.tag });
    }
    // Poisson-ish fill per landmass
    lms.forEach((lm, li) => {
      const b = lm.bbox;
      const area = (b[2] - b[0]) * (b[3] - b[1]);
      const tries = Math.ceil(area * 3.2);
      let placed = 0;
      for (let t = 0; t < tries; t++) {
        const x = b[0] + rnd() * (b[2] - b[0]), y = b[1] + rnd() * (b[3] - b[1]);
        if (landmassAt(x, y) !== li) continue;
        const ll = GEO.unproject(x, y);
        const r = spacing(ll[0], ll[1]);
        if (nearestSeedDist(x, y, r) < r) continue;
        addSeed({ x, y, lm: li }); placed++;
      }
      // ensure every landmass has at least one seed
      if (!seeds.some(s => s.lm === li)) {
        let cx = 0, cy = 0, n = lm.pts.length / 2;
        for (let i = 0; i < lm.pts.length; i += 2) { cx += lm.pts[i]; cy += lm.pts[i + 1]; }
        const s = snapToLand(cx / n, cy / n) || [lm.pts[0], lm.pts[1], li];
        addSeed({ x: s[0], y: s[1], lm: li });
      }
    });

    // --- Voronoi per landmass ---
    const provs = seeds.map((s, i) => ({ id: i, x: s.x, y: s.y, lm: s.lm, city: s.city || null, capital: !!s.capital, cityTag: s.cityTag || null, nb: [], poly: null }));
    const edges = []; // {a,b,x1,y1,x2,y2}
    const byLm = lms.map(() => []);
    provs.forEach(p => byLm[p.lm].push(p));
    byLm.forEach((list, li) => {
      const b = lms[li].bbox;
      const box = [b[0] - 1, b[1] - 1, b[2] + 1, b[3] + 1];
      for (const p of list) {
        let poly = [{ x: box[0], y: box[1], n: -1 }, { x: box[2], y: box[1], n: -1 }, { x: box[2], y: box[3], n: -1 }, { x: box[0], y: box[3], n: -1 }];
        const all = list.filter(q => q !== p).map(q => ({ q, d: Math.hypot(q.x - p.x, q.y - p.y) }));
        let others = all.filter(o => o.d < 14).sort((u, v) => u.d - v.d);
        let complete = others.length === all.length;
        for (let k = 0; k < others.length || !complete; k++) {
          if (k >= others.length) { others = all.sort((u, v) => u.d - v.d); complete = true; if (k >= others.length) break; }
          const o = others[k];
          let maxR = 0;
          for (const v of poly) { const d = Math.hypot(v.x - p.x, v.y - p.y); if (d > maxR) maxR = d; }
          if (o.d > 2 * maxR) break;
          if (!complete && 2 * maxR > 14 && k === others.length - 1) { /* may need farther seeds */ }
          poly = clipHalf(poly, p.x, p.y, o.q.x, o.q.y, o.q.id);
          if (poly.length < 3) break;
        }
        p.poly = poly;
      }
    });
    // edges & adjacency (shared edges whose samples lie on land)
    for (const p of provs) {
      const poly = p.poly;
      for (let i = 0; i < poly.length; i++) {
        const v = poly[i], w = poly[(i + 1) % poly.length];
        if (v.n < 0 || v.n < p.id) continue;
        const q = provs[v.n];
        let land = false;
        for (const t of [0.15, 0.35, 0.5, 0.65, 0.85]) {
          const x = v.x + (w.x - v.x) * t, y = v.y + (w.y - v.y) * t;
          if (landmassAt(x, y) === p.lm) { land = true; break; }
        }
        edges.push({ a: p.id, b: q.id, x1: v.x, y1: v.y, x2: w.x, y2: w.y, land });
        if (land) { p.nb.push(q.id); q.nb.push(p.id); }
      }
    }
    // provinces left without land neighbours on a multi-province landmass join their nearest ones
    for (const p of provs) {
      if (p.nb.length) continue;
      const cand = byLm[p.lm].filter(q => q !== p).sort((u, v) => Math.hypot(u.x - p.x, u.y - p.y) - Math.hypot(v.x - p.x, v.y - p.y)).slice(0, 2);
      for (const q of cand) if (!p.nb.includes(q.id)) { p.nb.push(q.id); q.nb.push(p.id); }
    }
    // straits
    function nearestProv(lon, lat) {
      const pp = P(lon, lat); let best = null, bd = Infinity;
      for (const p of provs) { const d = Math.hypot(p.x - pp[0], p.y - pp[1]); if (d < bd) { bd = d; best = p; } }
      return best;
    }
    const straits = [];
    for (const l of GEO.links) {
      const a = nearestProv(l[0], l[1]), b = nearestProv(l[2], l[3]);
      if (a && b && a !== b && !a.nb.includes(b.id)) { a.nb.push(b.id); b.nb.push(a.id); straits.push([a.id, b.id]); }
    }

    // --- province attributes ---
    for (const p of provs) {
      const ll = GEO.unproject(p.x, p.y);
      p.lon = ll[0]; p.lat = ll[1];
      p.terrain = terrainAt(p.lon, p.lat, rnd());
      if (p.capital) p.terrain = 'urban';
      p.spacing = spacing(p.lon, p.lat);
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const v of p.poly) { x0 = Math.min(x0, v.x); y0 = Math.min(y0, v.y); x1 = Math.max(x1, v.x); y1 = Math.max(y1, v.y); }
      p.bbox = [x0, y0, x1, y1];
      p.res = {};
    }
    // ownership: nearest anchor on the same landmass (fallback: any)
    for (const p of provs) {
      let best = null, bd = Infinity, bestAny = null, bdAny = Infinity;
      for (const a of anchors) {
        const d = Math.hypot(a.x - p.x, a.y - p.y);
        if (a.lm === p.lm && d < bd) { bd = d; best = a; }
        if (d < bdAny) { bdAny = d; bestAny = a; }
      }
      p.owner = (best || bestAny).tag;
      if (p.cityTag) p.owner = p.cityTag;
      p.core = p.owner;
    }
    // names
    const TERRAIN_WORD = { plains: 'Plains', forest: 'Woods', hills: 'Hills', mountains: 'Highlands', desert: 'Wastes', jungle: 'Jungle', marsh: 'Marshes', tundra: 'Tundra', urban: 'District' };
    const cityProvs = provs.filter(p => p.city);
    const used = {};
    for (const p of provs) {
      if (p.city) { p.name = p.city; continue; }
      let best = null, bd = Infinity;
      for (const c of cityProvs) {
        if (c.owner !== p.owner) continue;
        const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd) { bd = d; best = c; }
      }
      if (!best) for (const c of cityProvs) { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd) { bd = d; best = c; } }
      const dx = p.x - best.x, dy = p.y - best.y;
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'East' : 'West') : (dy > 0 ? 'South' : 'North');
      let name = best.city + ' ' + TERRAIN_WORD[p.terrain];
      if (used[name]) name = dir + ' ' + name;
      if (used[name]) name = 'Upper ' + best.city + ' ' + TERRAIN_WORD[p.terrain];
      if (used[name]) name = best.city + ' ' + TERRAIN_WORD[p.terrain] + ' ' + (used[name] + 1);
      used[name] = (used[name] || 0) + 1;
      p.name = name;
    }
    // resources
    for (const r of RESOURCE_SITES) {
      const p = nearestProv(r[1], r[2]);
      if (p) p.res[r[0]] = (p.res[r[0]] || 0) + r[3];
    }
    for (const p of provs) {
      if (p.terrain === 'hills' || p.terrain === 'mountains') { if (rnd() < 0.35) p.res.steel = (p.res.steel || 0) + 1 + Math.floor(rnd() * 3); if (rnd() < 0.25) p.res.coal = (p.res.coal || 0) + 1 + Math.floor(rnd() * 3); }
      else if (rnd() < 0.08) p.res.coal = (p.res.coal || 0) + 1 + Math.floor(rnd() * 2);
    }
    // population, infrastructure, factories
    const byOwner = {};
    provs.forEach(p => { (byOwner[p.owner] = byOwner[p.owner] || []).push(p); });
    for (const c of COUNTRY_DEFS) {
      const list = byOwner[c.tag] || [];
      if (!list.length) continue;
      // Homeland = provinces on the capital's landmass within reach; colonies weigh less.
      const cap = list.find(p => p.capital) || list[0];
      let wsum = 0;
      for (const p of list) {
        const home = p.lm === cap.lm && Math.hypot(p.x - cap.x, p.y - cap.y) < 25;
        p.home = home;
        p.w = TERRAIN[p.terrain].pop * (p.capital ? 6 : p.city ? 2.5 : 1) * (home ? 1 : 0.35) * (0.7 + rnd() * 0.6);
        wsum += p.w;
      }
      for (const p of list) {
        p.pop = Math.max(5000, Math.round(c.pop * 1e6 * p.w / wsum / 1000) * 1000);
        const rough = ['mountains', 'jungle', 'marsh', 'tundra', 'desert'].includes(p.terrain) ? 1 : 0;
        p.infra = Math.max(1, Math.min(5, Math.round(c.tech * 2.4 - 0.4 + (p.city ? 1 : 0) + (p.capital ? 1 : 0) - rough - (p.home ? 0 : 1))));
        p.civ = 0; p.mil = 0;
      }
      const ranked = list.slice().sort((a, b) => (b.pop * b.infra) - (a.pop * a.infra));
      let civ = c.civ, mil = c.mil, i = 0;
      while ((civ > 0 || mil > 0) && ranked.length) {
        const p = ranked[i % Math.min(ranked.length, Math.max(3, Math.ceil(ranked.length / 3)))];
        if (civ > 0) { p.civ++; civ--; }
        if (mil > 0 && i % 2 === 0) { p.mil++; mil--; }
        i++;
      }
    }
    for (const p of provs) { delete p.w; if (p.pop === undefined) { p.pop = 20000; p.infra = 1; p.civ = 0; p.mil = 0; } }

    // Path2D data in world coords
    const flat = p => { const a = []; for (const v of p.poly) a.push(v.x, v.y); return a; };
    provs.forEach(p => { p.flat = flat(p); });

    const dt = performance.now() - t0;
    return { provs, edges, lms, lakes, straits, landmassAt, genMs: dt };
  }

  return { generate, pip };
})();

// Simulation: game state, clock, armies, movement, combat, wars, capitulation and AI.
'use strict';
const Sim = (function () {
  let MAP = null;   // generated map
  let G = null;     // game state (serialisable)
  let nbDist = [];  // km between adjacent provinces
  const hooks = { notify: () => {}, pause: () => {}, gameOver: () => {} };

  const START = Date.UTC(1936, 0, 1, 0, 0, 0);
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const ORD = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  let rng = mulberry32(42);

  function dateOf(hour) { return new Date(START + hour * 3600e3); }
  function dateStr(hour, withTime) {
    const d = dateOf(hour);
    const s = d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    return withTime ? String(d.getUTCHours()).padStart(2, '0') + ':00, ' + s : s;
  }

  // ---------- setup ----------
  function init(map) {
    MAP = map;
    nbDist = MAP.provs.map(p => p.nb.map(q => GEO.haversineKm(p.lon, p.lat, MAP.provs[q].lon, MAP.provs[q].lat)));
  }
  function distKm(a, b) {
    const i = MAP.provs[a].nb.indexOf(b);
    return i >= 0 ? nbDist[a][i] : GEO.haversineKm(MAP.provs[a].lon, MAP.provs[a].lat, MAP.provs[b].lon, MAP.provs[b].lat);
  }

  function newGame(playerTag) {
    rng = mulberry32(1936 + playerTag.charCodeAt(0) * 7 + playerTag.charCodeAt(1));
    G = {
      hour: 0, speed: 2, paused: true, player: playerTag, over: false, ownVer: 0,
      countries: {}, owner: MAP.provs.map(p => p.owner),
      armies: [], nextArmy: 1, battles: [], nextBattle: 1, wars: [], nextWar: 1,
      log: [], stats: { captured: 0, lost: 0, battlesWon: 0, battlesLost: 0 },
      settings: { autoPause: true, pauseWar: true, pauseBattle: false, pauseLoss: true, pauseCapitulation: true }
    };
    for (const d of COUNTRY_DEFS) {
      const capital = MAP.provs.find(p => p.capital && p.cityTag === d.tag);
      const base = GOV_BASE[d.gov];
      G.countries[d.tag] = {
        tag: d.tag, name: d.name, color: d.color, gov: d.gov, overlord: d.overlord || null, culture: d.culture,
        pp: d.tag === playerTag ? 60 : 30, stab: base.stab, ws: base.ws, tech: d.tech,
        manpower: Math.round(d.pop * 1e6 * 0.012), losses: 0, equipment: d.divs * 60 + d.mil * 250,
        civ: d.civ, mil: d.mil, capital: capital ? capital.id : -1, alive: true, queue: [], armySeq: 0, baseDivs: d.divs
      };
    }
    for (const d of COUNTRY_DEFS) spawnInitialArmies(d);
    declareWar('ITA', 'ETH', true);
    return G;
  }

  function commanderFor(c) {
    const pool = NAME_POOLS[c.culture] || NAME_POOLS.oth;
    const initial = 'ABCDEFGHJKLMNOPRSTVW'[Math.floor(rng() * 20)];
    return { name: 'Gen. ' + initial + '. ' + pool[Math.floor(rng() * pool.length)], skill: 1 + Math.floor(rng() * 4) };
  }
  function makeUnit(type, str) { return { type, str: str === undefined ? 1 : str, org: 1 }; }
  function newArmy(tag, prov, units) {
    const c = G.countries[tag];
    c.armySeq++;
    const a = { id: G.nextArmy++, owner: tag, name: ORD(c.armySeq) + ' Army', commander: commanderFor(c), units, prov,
      path: [], progress: 0, order: 'hold', target: -1, frontTag: null, battle: 0, retreating: false, entrench: 0, supply: 1 };
    G.armies.push(a);
    return a;
  }

  function spawnInitialArmies(d) {
    const c = G.countries[d.tag];
    if (!d.divs || c.capital < 0) return;
    const types = [];
    for (let i = 0; i < d.divs; i++) {
      const r = rng();
      if (d.mil >= 8 && r < 0.10) types.push('tanks');
      else if (d.mil >= 8 && r < 0.20) types.push('motorized');
      else if (r < 0.33) types.push('artillery');
      else if (d.mil >= 10 && r < 0.36) types.push('recon');
      else types.push('infantry');
    }
    // overseas garrisons first
    for (const [city, n] of (d.garrisons || [])) {
      const prov = MAP.provs.find(p => p.city === city && G.owner[p.id] === d.tag);
      const take = types.splice(0, Math.min(n, types.length - 1));
      if (prov && take.length) newArmy(d.tag, prov.id, take.map(t => makeUnit(t))).entrench = 0.1;
    }
    const nd = types.length;
    const nArmies = Math.ceil(nd / 8);
    const home = MAP.provs.filter(p => G.owner[p.id] === d.tag && p.home);
    const border = home.filter(p => p.nb.some(q => G.owner[q] !== d.tag))
      .map(p => ({ p, w: p.nb.reduce((s, q) => s + (G.owner[q] !== d.tag ? (G.countries[G.owner[q]] ? G.countries[G.owner[q]].mil + 1 : 1) : 0), 0) + rng() * 3 }))
      .sort((a, b) => b.w - a.w).map(o => o.p.id);
    const spots = [c.capital, ...border.filter(id => id !== c.capital)];
    for (let i = 0; i < nArmies; i++) {
      const slice = types.slice(Math.floor(i * nd / nArmies), Math.floor((i + 1) * nd / nArmies));
      if (!slice.length) continue;
      const prov = spots[i % spots.length];
      const a = newArmy(d.tag, prov, slice.map(t => makeUnit(t)));
      a.entrench = 0.1;
    }
  }

  // ---------- relations ----------
  function root(tag) {
    let t = tag, guard = 0;
    while (G.countries[t] && G.countries[t].overlord && G.countries[G.countries[t].overlord] && G.countries[G.countries[t].overlord].alive && guard++ < 5) t = G.countries[t].overlord;
    return t;
  }
  function family(tag) {
    const r = root(tag);
    return Object.values(G.countries).filter(c => c.alive && root(c.tag) === r).map(c => c.tag);
  }
  function sideOf(war, tag) { return war.attackers.includes(tag) ? 'att' : war.defenders.includes(tag) ? 'def' : null; }
  function atWar(a, b) {
    if (a === b) return false;
    for (const w of G.wars) {
      const sa = sideOf(w, a), sb = sideOf(w, b);
      if (sa && sb && sa !== sb) return true;
    }
    return false;
  }
  function allied(a, b) {
    if (a === b) return true;
    if (root(a) === root(b)) return true;
    for (const w of G.wars) { const sa = sideOf(w, a); if (sa && sa === sideOf(w, b)) return true; }
    return false;
  }
  function enemiesOf(tag) {
    const s = new Set();
    for (const w of G.wars) {
      const side = sideOf(w, tag);
      if (!side) continue;
      (side === 'att' ? w.defenders : w.attackers).forEach(t => s.add(t));
    }
    return s;
  }
  function isAtWar(tag) { return G.wars.some(w => sideOf(w, tag)); }
  function canEnter(tag, prov) { const o = G.owner[prov]; return o === tag || allied(tag, o) || atWar(tag, o); }

  function declareWar(att, def, silent) {
    if (att === def || atWar(att, def) || allied(att, def)) return null;
    const A = family(att), D = family(def).filter(t => !A.includes(t));
    const war = { id: G.nextWar++, attackers: A, defenders: D, leaderA: att, leaderD: def, goal: 'Conquer ' + G.countries[def].name, start: G.hour };
    const total = A.length + D.length;
    war.name = total >= 8 ? 'World War' : G.countries[att].name + '–' + G.countries[def].name + ' War';
    G.wars.push(war);
    for (const t of A.concat(D)) { const c = G.countries[t]; c.ws = Math.min(1, c.ws + 0.1); }
    if (!silent) {
      const involvesPlayer = A.includes(G.player) || D.includes(G.player);
      notify(G.countries[att].name + ' declared war on ' + G.countries[def].name + '.', G.countries[def].capital, 'war', involvesPlayer && G.settings.pauseWar);
    }
    return war;
  }

  // ---------- pathfinding ----------
  function findPath(tag, from, to, mode) {
    if (from === to) return [];
    const provs = MAP.provs;
    const passable = id => mode === 'redeploy' ? (G.owner[id] === tag || allied(tag, G.owner[id])) : canEnter(tag, id);
    if (!passable(to)) return null;
    const tp = provs[to];
    const h = id => GEO.haversineKm(provs[id].lon, provs[id].lat, tp.lon, tp.lat);
    const g = new Map([[from, 0]]), came = new Map();
    const open = [[h(from), from]];
    const closed = new Set();
    while (open.length) {
      let bi = 0; for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
      const [, cur] = open[bi]; open.splice(bi, 1);
      if (cur === to) break;
      if (closed.has(cur)) continue; closed.add(cur);
      const p = provs[cur];
      for (let k = 0; k < p.nb.length; k++) {
        const n = p.nb[k];
        if (closed.has(n) || !passable(n)) continue;
        const cost = g.get(cur) + nbDist[cur][k] / TERRAIN[provs[n].terrain].move;
        if (cost < (g.has(n) ? g.get(n) : Infinity)) { g.set(n, cost); came.set(n, cur); open.push([cost + h(n), n]); }
      }
      if (closed.size > 2500) break;
    }
    if (!came.has(to)) return null;
    const path = [to]; let c = to;
    while (came.get(c) !== from) { c = came.get(c); path.unshift(c); }
    return path;
  }

  // ---------- army helpers ----------
  function army(id) { return G.armies.find(a => a.id === id); }
  function armiesAt(prov) { return G.armies.filter(a => a.prov === prov); }
  function hostilesAt(tag, prov) { return G.armies.filter(a => a.prov === prov && !a.retreating && atWar(a.owner, tag)); }
  function armySpeed(a) {
    let s = Infinity; for (const u of a.units) s = Math.min(s, UNIT_TYPES[u.type].speed);
    s *= 0.6 + 0.4 * a.supply;
    if (a.order === 'redeploy') s *= 2.5;
    if (a.retreating) s *= 1.3;
    return s;
  }
  function armyStats(a) {
    let str = 0, org = 0, divs = a.units.length;
    for (const u of a.units) { str += u.str; org += u.org; }
    return { str: divs ? str / divs : 0, org: divs ? org / divs : 0, divs };
  }
  function armyPower(a, role, terrain) {
    let v = 0;
    const T = TERRAIN[terrain];
    for (const u of a.units) {
      const t = UNIT_TYPES[u.type];
      if (role === 'atk') v += t.atk * u.str * (0.3 + 0.7 * u.org) * T.atk * (t.armor ? T.armor : 1);
      else v += t.def * u.str * (0.4 + 0.6 * u.org);
    }
    const c = G.countries[a.owner];
    v *= c.tech * (1 + 0.05 * a.commander.skill) * (0.5 + 0.5 * a.supply);
    if (role === 'def') v *= 1 + a.entrench;
    return v;
  }
  function manpowerOf(a) { return a.units.reduce((s, u) => s + UNIT_TYPES[u.type].mp * u.str, 0); }

  // ---------- orders ----------
  function orderMove(a, dest, kind) {
    if (a.battle) leaveBattle(a);
    const mode = kind === 'redeploy' ? 'redeploy' : 'move';
    const path = findPath(a.owner, a.prov, dest, mode);
    if (!path) return false;
    a.path = path; a.progress = 0; a.order = kind || 'move'; a.target = dest; a.retreating = false;
    return true;
  }
  function orderHold(a) { if (a.battle) leaveBattle(a); a.path = []; a.progress = 0; a.order = 'hold'; a.target = -1; a.frontTag = null; }
  function orderDefend(a, frontTag) { if (a.battle) leaveBattle(a); a.path = []; a.progress = 0; a.order = 'defend'; a.frontTag = frontTag || null; a.target = -1; }
  function orderRetreat(a) {
    const c = G.countries[a.owner];
    if (a.battle) leaveBattle(a);
    // nearest own province not bordering an enemy
    const en = enemiesOf(a.owner);
    const seen = new Set([a.prov]); let frontier = [a.prov], dest = -1;
    for (let depth = 0; depth < 12 && dest < 0 && frontier.length; depth++) {
      const next = [];
      for (const p of frontier) for (const n of MAP.provs[p].nb) {
        if (seen.has(n)) continue; seen.add(n);
        if (G.owner[n] !== a.owner && !allied(a.owner, G.owner[n])) continue;
        if (!MAP.provs[n].nb.some(q => en.has(G.owner[q]))) { dest = n; break; }
        next.push(n);
      }
      frontier = next;
    }
    if (dest < 0) dest = c.capital;
    const ok = orderMove(a, dest, 'move');
    if (ok) a.order = 'retreat';
    return ok;
  }
  function mergeArmies(list) {
    if (list.length < 2) return null;
    const base = list[0];
    for (const a of list.slice(1)) {
      if (a.owner !== base.owner || a.prov !== base.prov) continue;
      if (a.battle) leaveBattle(a);
      base.units.push(...a.units);
      removeArmy(a);
    }
    return base;
  }
  function splitArmy(a) {
    if (a.units.length < 2) return null;
    const half = a.units.splice(Math.floor(a.units.length / 2));
    const b = newArmy(a.owner, a.prov, half);
    b.entrench = a.entrench; b.supply = a.supply;
    return b;
  }
  function removeArmy(a) {
    if (a.battle) leaveBattle(a);
    G.armies = G.armies.filter(x => x !== a);
  }

  // ---------- battles ----------
  function battleAt(prov) { return G.battles.find(b => b.prov === prov); }
  function startBattle(a, prov) {
    let b = G.battles.find(x => x.prov === prov && allied(x.atkTag, a.owner));
    if (!b) {
      const defs = hostilesAt(a.owner, prov);
      b = { id: G.nextBattle++, prov, atkTag: a.owner, defTag: defs[0].owner, attackers: [], from: {}, start: G.hour,
        casA: 0, casD: 0, progress: 0.5, rateA: 0, rateD: 0, mods: [] };
      G.battles.push(b);
      const pl = G.player;
      if (allied(a.owner, pl) || defs.some(d => allied(d.owner, pl))) {
        notify('Battle of ' + MAP.provs[prov].name + ' has begun.', prov, 'battle', G.settings.pauseBattle && (a.owner === pl || defs.some(d => d.owner === pl)));
      }
    }
    if (!b.attackers.includes(a.id)) { b.attackers.push(a.id); b.from[a.id] = a.prov; }
    a.battle = b.id; a.entrench = 0;
  }
  function leaveBattle(a) {
    const b = G.battles.find(x => x.id === a.battle);
    if (b) b.attackers = b.attackers.filter(id => id !== a.id);
    a.battle = 0;
  }
  function endBattle(b) {
    G.battles = G.battles.filter(x => x !== b);
    for (const id of b.attackers) { const a = army(id); if (a && a.battle === b.id) a.battle = 0; }
  }

  function stepBattle(b) {
    const prov = MAP.provs[b.prov];
    const atts = b.attackers.map(army).filter(a => a && a.battle === b.id && a.units.length);
    b.attackers = atts.map(a => a.id);
    if (!atts.length) { endBattle(b); return; }
    const defs = hostilesAt(b.atkTag, b.prov).filter(d => d.units.length);
    if (!defs.length) { endBattle(b); return; }   // attackers will advance on their own
    b.defTag = defs[0].owner;

    const fronts = new Set(atts.map(a => b.from[a.id])).size;
    const flank = 1 + 0.1 * (fronts - 1);
    const recon = atts.some(a => a.units.some(u => u.type === 'recon')) ? 1.08 : 1;
    let A = 0, B = 0, D = 0, F = 0;
    for (const a of atts) { A += armyPower(a, 'atk', prov.terrain); B += armyPower(a, 'def', prov.terrain) * 0.6; }
    A *= flank * recon;
    for (const d of defs) { D += armyPower(d, 'def', prov.terrain); F += armyPower(d, 'atk', 'plains') * 0.9; }
    const ra = Math.max(0.1, Math.min(6, A / Math.max(D, 1)));
    const rd = Math.max(0.1, Math.min(6, F / Math.max(B, 1)));
    const hitD = 0.014 * ra, hitA = 0.014 * rd;
    const apply = (list, hit, key) => {
      for (const a of list) for (const u of a.units) {
        const t = UNIT_TYPES[u.type];
        const orgLoss = hit * (0.7 + rng() * 0.6) * 50 / t.org;
        u.org = Math.max(0, u.org - orgLoss);
        const sl = Math.min(u.str, orgLoss * 0.22);
        u.str -= sl;
        const cas = sl * t.mp;
        b[key] += cas;
        G.countries[a.owner].losses += cas;
      }
    };
    apply(defs, hitD, 'casD');
    apply(atts, hitA, 'casA');
    b.rateD = hitD; b.rateA = hitA;
    const T = TERRAIN[prov.terrain];
    b.mods = [
      ['Terrain: ' + T.name, T.atk - 1],
      ['Defender entrenchment', -avg(defs.map(d => d.entrench))],
      ['Attacker supply', avg(atts.map(a => a.supply)) * 0.5 - 0.5],
      ['Defender supply', -(avg(defs.map(d => d.supply)) * 0.5 - 0.5)],
      ['Attacker commanders', 0.05 * avg(atts.map(a => a.commander.skill))],
      ['Defender commanders', -0.05 * avg(defs.map(d => d.commander.skill))],
      ['Technology', G.countries[b.atkTag].tech - G.countries[b.defTag].tech]
    ];
    if (fronts > 1) b.mods.push(['Attack from ' + fronts + ' sides', flank - 1]);
    if (recon > 1) b.mods.push(['Reconnaissance', recon - 1]);
    // remove shattered units
    for (const a of atts.concat(defs)) {
      a.units = a.units.filter(u => u.str > 0.05);
      if (!a.units.length) { notify(G.countries[a.owner].name + ' ' + a.name + ' was destroyed.', a.prov, 'loss', false); removeArmy(a); }
    }
    const dOrg = avg(defs.flatMap(d => d.units.map(u => u.org)));
    const aOrg = avg(atts.flatMap(a => a.units.map(u => u.org)));
    b.progress = (1 - dOrg) / ((1 - dOrg) + (1 - aOrg) + 1e-6);
    b.aOrg = aOrg; b.dOrg = dOrg;
    b.aStr = avg(atts.flatMap(a => a.units.map(u => u.str))); b.dStr = avg(defs.flatMap(d => d.units.map(u => u.str)));
    const pl = G.player;
    if (!defs.some(d => d.units.length) || dOrg < 0.06) {
      // attackers win; defenders retreat
      for (const d of defs) if (G.armies.includes(d)) retreatFrom(d, b);
      if (allied(b.atkTag, pl)) G.stats.battlesWon++;
      if (allied(b.defTag, pl)) G.stats.battlesLost++;
      if (b.atkTag === pl || defs.some(d => d.owner === pl))
        notify((b.atkTag === pl ? 'Victory' : 'Defeat') + ' at ' + prov.name + '.', b.prov, b.atkTag === pl ? 'win' : 'loss', false);
      for (const c of [b.atkTag, b.defTag]) { const cc = G.countries[c]; if (cc) cc.ws = Math.max(0, Math.min(1, cc.ws + (c === b.atkTag ? 0.004 : -0.004))); }
      endBattle(b);
    } else if (aOrg < 0.12) {
      for (const a of atts) { a.path = []; a.progress = 0; if (a.order !== 'defend') a.order = 'hold'; a.battle = 0; }
      if (b.atkTag === pl || defs.some(d => d.owner === pl))
        notify('The attack on ' + prov.name + ' was repulsed.', b.prov, b.atkTag === pl ? 'loss' : 'win', false);
      endBattle(b);
    }
  }
  function avg(arr) { return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0; }

  function retreatFrom(d, b) {
    const from = MAP.provs[b.prov];
    const attFrom = new Set(Object.values(b.from));
    const opts = from.nb.filter(n => (G.owner[n] === d.owner || allied(d.owner, G.owner[n])) && !hostilesAt(d.owner, n).length && !attFrom.has(n));
    if (!opts.length) {
      notify(G.countries[d.owner].name + ' ' + d.name + ' was encircled and destroyed at ' + from.name + '.', b.prov, d.owner === G.player ? 'loss' : 'win', false);
      G.countries[d.owner].losses += manpowerOf(d);
      removeArmy(d); return;
    }
    opts.sort((x, y) => friendlyScore(d.owner, y) - friendlyScore(d.owner, x));
    d.path = [opts[0]]; d.progress = 0; d.retreating = true; d.entrench = 0; d.battle = 0;
    if (d.order !== 'defend') d.order = 'retreat';
  }
  function friendlyScore(tag, p) {
    let s = 0;
    for (const n of MAP.provs[p].nb) { if (G.owner[n] === tag) s += 1; else if (atWar(tag, G.owner[n])) s -= 2; }
    return s;
  }

  // ---------- territory ----------
  function capture(prov, tag) {
    const prev = G.owner[prov];
    const p = MAP.provs[prov];
    let newOwner = tag;
    const core = p.core;
    if (core !== tag && G.countries[core] && G.countries[core].alive && allied(core, tag) && core !== prev) newOwner = core; // liberation
    G.owner[prov] = newOwner;
    G.ownVer++;
    if (newOwner === G.player) G.stats.captured++;
    if (prev === G.player) {
      G.stats.lost++;
      if (p.capital || p.city) notify(p.name + ' has fallen to ' + G.countries[tag].name + '.', prov, 'loss', G.settings.pauseLoss);
    }
    // capital relocation
    const pc = G.countries[prev];
    if (pc && pc.capital === prov) {
      const alt = MAP.provs.filter(q => G.owner[q.id] === prev && q.core === prev && q.city).sort((x, y) => (y.home - x.home) || (y.pop - x.pop))[0];
      if (alt) { pc.capital = alt.id; pc.stab = Math.max(0, pc.stab - 0.1); notify(pc.name + ' moved its capital to ' + alt.name + '.', alt.id, 'info', false); }
    }
  }

  function checkCapitulations() {
    for (const c of Object.values(G.countries)) {
      if (!c.alive || !isAtWar(c.tag)) continue;
      const home = MAP.provs.filter(p => p.core === c.tag && p.home);
      if (!home.length) continue;
      const held = home.filter(p => G.owner[p.id] === c.tag).length;
      const anyLeft = MAP.provs.some(p => G.owner[p.id] === c.tag);
      const capLost = G.owner[home.find(p => p.capital) ? home.find(p => p.capital).id : home[0].id] !== c.tag;
      if (!anyLeft || held / home.length < 0.35 || (capLost && held / home.length < 0.55)) capitulate(c.tag);
    }
  }

  function capitulate(tag) {
    const c = G.countries[tag];
    const enemies = [...enemiesOf(tag)];
    // the enemy holding the most of this country's land receives the rest

  function pan(dx, dy) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; clampCam(); cam.anim = false; }
  function flyTo(x, y, z) { cam.tx = x; cam.ty = y; cam.tz = z || cam.z; cam.anim = true; }
  function fitWorld() { flyTo(0, -25, minZoom()); }
  function stepCamera() {
    if (!cam.anim) return;
    cam.x += (cam.tx - cam.x) * 0.18; cam.y += (cam.ty - cam.y) * 0.18;
    cam.z *= Math.pow(cam.tz / cam.z, 0.18);
    clampCam();
    if (Math.abs(cam.tx - cam.x) < 0.01 && Math.abs(cam.ty - cam.y) < 0.01 && Math.abs(cam.tz / cam.z - 1) < 0.002) cam.anim = false;
  }

  // ---------- picking ----------
  function provinceAt(wx, wy) {
    const lm = MAP.landmassAt(wx, wy);
    if (lm < 0) return -1;
    let best = -1, bd = Infinity;
    const gx = Math.floor(wx / 4), gy = Math.floor(wy / 4);
    for (let r = 1; r <= 3 && best < 0; r++) {
      for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {
        const arr = provGrid.get((gx + i) * 1000 + gy + j); if (!arr) continue;
        for (const p of arr) { if (p.lm !== lm) continue; const d = (p.x - wx) ** 2 + (p.y - wy) ** 2; if (d < bd) { bd = d; best = p.id; } }
      }
    }
    return best;
  }
  function counterAt(sx, sy) {
    for (let i = counterHits.length - 1; i >= 0; i--) { const h = counterHits[i]; if (sx >= h.x && sx <= h.x + h.w && sy >= h.y && sy <= h.y + h.h) return h.army; }
    return null;
  }
  function battleAtScreen(sx, sy) {
    for (const h of battleHits) if (Math.hypot(sx - h.x, sy - h.y) < 13) return h.battle;
    return null;
  }

  // ---------- drawing ----------
  function armyPos(a) {
    const p = MAP.provs[a.prov];
    if (a.path.length && a.progress > 0) {
      const n = MAP.provs[a.path[0]];
      const t = Math.min(1, a.progress / Sim.distKm(a.prov, a.path[0]));
      return [p.x + (n.x - p.x) * t, p.y + (n.y - p.y) * t];
    }
    return [p.x, p.y];
  }

  function stripes(color) {
    if (stripeCache[color]) return stripeCache[color];
    const c = document.createElement('canvas'); c.width = c.height = 10;
    const g = c.getContext('2d');
    g.strokeStyle = color; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-2, 12); g.lineTo(12, -2); g.moveTo(8, 12); g.lineTo(12, 8); g.moveTo(-2, 2); g.lineTo(2, -2); g.stroke();
    return (stripeCache[color] = c);
  }

  // Paint ocean, land, borders and coasts into context g (world transform already applied), limited to a view box.
  function paintWorld(g, z, vx0, vy0, vx1, vy1) {
    const G = Sim.G;
    g.fillStyle = '#1f384b'; g.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
    g.strokeStyle = 'rgba(190,215,230,0.07)'; g.lineWidth = 1 / z;
    g.beginPath();
    for (let lon = -180; lon <= 180; lon += 15) { if (lon >= vx0 - 1 && lon <= vx1 + 1) { g.moveTo(lon, Math.max(vy0, WORLD.y0)); g.lineTo(lon, Math.min(vy1, WORLD.y1)); } }
    for (let lat = -60; lat <= 80; lat += 15) { const y = GEO.project(0, lat)[1]; if (y >= vy0 - 1 && y <= vy1 + 1) { g.moveTo(Math.max(vx0, -180), y); g.lineTo(Math.min(vx1, 180), y); } }
    g.stroke();
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(120,160,180,0.16)'; g.lineWidth = Math.max(0.9, 7 / z); g.stroke(coastPath);
    g.strokeStyle = 'rgba(120,160,180,0.12)'; g.lineWidth = Math.max(0.4, 3 / z); g.stroke(coastPath);
    MAP.lms.forEach((l, li) => {
      const b = l.bbox;
      if (b[2] < vx0 || b[0] > vx1 || b[3] < vy0 || b[1] > vy1) return;
      g.save();
      g.clip(lmClips[li], 'evenodd');
      for (const p of lmProvs[li]) {
        const bb = p.tb;
        if (bb[2] < vx0 || bb[0] > vx1 || bb[3] < vy0 || bb[1] > vy1) continue;
        g.fillStyle = fillCache[p.id];
        g.fill(provPaths[p.id]);
        if (G && state.mode === 'political' && G.owner[p.id] !== p.core) {
          const pat = g.createPattern(stripes(COUNTRY_BY_TAG[p.core].color), 'repeat');
          pat.setTransform(new DOMMatrix().scale(1 / z));
          g.globalAlpha = 0.55; g.fillStyle = pat; g.fill(provPaths[p.id]); g.globalAlpha = 1;
        }
      }
      if (z > 5) {
        g.lineWidth = Math.min(0.08, 0.9 / z); g.strokeStyle = 'rgba(20,20,15,' + Math.min(0.35, (z - 5) * 0.05) + ')';
        g.stroke(lmBorders[li]);
      }
      g.lineWidth = Math.max(1.3 / z, Math.min(0.14, 2.2 / z)); g.strokeStyle = 'rgba(16,18,16,0.78)';
      g.stroke(lmCountryBorders[li]);
      g.restore();
    });
    g.strokeStyle = 'rgba(10,20,26,0.85)'; g.lineWidth = 1.1 / z; g.stroke(coastPath);
    g.fillStyle = '#20394b'; g.fill(lakePath);
    g.strokeStyle = 'rgba(10,20,26,0.85)'; g.stroke(lakePath);
    g.setLineDash([3 / z, 3 / z]); g.strokeStyle = 'rgba(230,220,190,0.5)'; g.lineWidth = 1.2 / z;
    g.beginPath();
    for (const [a, b] of MAP.straits) { g.moveTo(MAP.provs[a].x, MAP.provs[a].y); g.lineTo(MAP.provs[b].x, MAP.provs[b].y); }
    g.stroke(); g.setLineDash([]);
  }

  // Cached raster of the whole world, used when zoomed out.
  const LS = 7;
  let layer = null, lctx = null;
  function layerTransform() { lctx.setTransform(LS, 0, 0, LS, -WORLD.x0 * LS, -WORLD.y0 * LS); }
  function buildLayer() {
    if (!layer) {
      layer = document.createElement('canvas');
      layer.width = Math.round((WORLD.x1 - WORLD.x0) * LS); layer.height = Math.round((WORLD.y1 - WORLD.y0) * LS);
      lctx = layer.getContext('2d');
    }
    layerTransform();
    paintWorld(lctx, LS, WORLD.x0, WORLD.y0, WORLD.x1, WORLD.y1);
  }
  function patchLayer(i) {
    const p = MAP.provs[i], r = p.spacing * 1.8 + 0.5;
    const box = [Math.max(p.tb[0], p.x - r) - 0.3, Math.max(p.tb[1], p.y - r) - 0.3, Math.min(p.tb[2], p.x + r) + 0.3, Math.min(p.tb[3], p.y + r) + 0.3];
    layerTransform();
    lctx.save();
    lctx.beginPath(); lctx.rect(box[0], box[1], box[2] - box[0], box[3] - box[1]); lctx.clip();
    paintWorld(lctx, LS, box[0], box[1], box[2], box[3]);
    lctx.restore();
  }

  // Viewport cache for close zoom: a raster of the view plus margin, reused while panning.
  const vc = { canvas: null, g: null, valid: false, z: 0, x0: 0, y0: 0, x1: 0, y1: 0, s: 1 };
  let lastZoomInput = 0;
  function buildView(vx0, vy0, vx1, vy1) {
    const mx = (vx1 - vx0) * 0.35, my = (vy1 - vy0) * 0.35;
    vc.x0 = vx0 - mx; vc.y0 = vy0 - my; vc.x1 = vx1 + mx; vc.y1 = vy1 + my;
    vc.z = cam.z; vc.s = cam.z * dpr;
    if (!vc.canvas) { vc.canvas = document.createElement('canvas'); vc.g = vc.canvas.getContext('2d'); }
    vc.canvas.width = Math.ceil((vc.x1 - vc.x0) * vc.s); vc.canvas.height = Math.ceil((vc.y1 - vc.y0) * vc.s);
    vc.g.setTransform(vc.s, 0, 0, vc.s, -vc.x0 * vc.s, -vc.y0 * vc.s);
    paintWorld(vc.g, vc.z, vc.x0, vc.y0, vc.x1, vc.y1);
    vc.valid = true;
  }
  function patchView(i) {
    if (!vc.valid) return;
    const p = MAP.provs[i], r = p.spacing * 1.8 + 0.5;
    const box = [Math.max(p.tb[0], p.x - r) - 0.3, Math.max(p.tb[1], p.y - r) - 0.3, Math.min(p.tb[2], p.x + r) + 0.3, Math.min(p.tb[3], p.y + r) + 0.3];
    if (box[2] < vc.x0 || box[0] > vc.x1 || box[3] < vc.y0 || box[1] > vc.y1) return;
    const g = vc.g;
    g.setTransform(vc.s, 0, 0, vc.s, -vc.x0 * vc.s, -vc.y0 * vc.s);
    g.save(); g.beginPath(); g.rect(box[0], box[1], box[2] - box[0], box[3] - box[1]); g.clip();
    paintWorld(g, vc.z, box[0], box[1], box[2], box[3]);
    g.restore();
  }

  function draw() {
    stepCamera();
    if (state.dirtyOwners || !lmCountryBorders.length) recolor();
    if (!layer) buildLayer();
    const G = Sim.G;
    const z = cam.z;
    const [vx0, vy0] = screenToWorld(0, 0), [vx1, vy1] = screenToWorld(W, H);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (z * dpr <= LS * 1.25) {
      ctx.fillStyle = '#1f384b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
      const sx = (vx0 - WORLD.x0) * LS, sy = (vy0 - WORLD.y0) * LS;
      ctx.drawImage(layer, sx, sy, (vx1 - vx0) * LS, (vy1 - vy0) * LS, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - cam.x * z), dpr * (H / 2 - cam.y * z));
    } else {
      const covers = vc.valid && vx0 >= vc.x0 && vy0 >= vc.y0 && vx1 <= vc.x1 && vy1 <= vc.y1;
      const zooming = cam.anim || performance.now() - lastZoomInput < 220;
      if (!(covers && (vc.z === z || zooming))) buildView(vx0, vy0, vx1, vy1);
      ctx.fillStyle = '#1f384b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(vc.canvas, (vx0 - vc.x0) * vc.s, (vy0 - vc.y0) * vc.s, (vx1 - vx0) * vc.s, (vy1 - vy0) * vc.s, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - cam.x * z), dpr * (H / 2 - cam.y * z));
    }
    // live overlays: front lines, hover, selection
    const overlay = (id, fn) => { const p = MAP.provs[id]; ctx.save(); ctx.clip(lmClips[p.lm], 'evenodd'); fn(p); ctx.restore(); };
    if (state.frontEdges) { ctx.lineWidth = 4 / z; ctx.strokeStyle = 'rgba(214,176,82,0.9)'; ctx.lineCap = 'round'; ctx.stroke(state.frontEdges); }
    if (state.hover >= 0) overlay(state.hover, () => { ctx.fillStyle = 'rgba(255,245,210,0.16)'; ctx.fill(provPaths[state.hover]); });
    if (state.selProv >= 0) overlay(state.selProv, () => {
      ctx.fillStyle = 'rgba(255,240,190,0.22)'; ctx.fill(provPaths[state.selProv]);
      ctx.lineWidth = 2.2 / z; ctx.strokeStyle = 'rgba(255,236,170,0.95)'; ctx.stroke(provPaths[state.selProv]);
    });

    // ---- screen space ----
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawLabels(z, vx0, vy0, vx1, vy1);
    drawCities(z, vx0, vy0, vx1, vy1);
    if (G) { drawPaths(z); drawArmies(z, vx0, vy0, vx1, vy1); drawBattles(z); }
  }

  function drawLabels(z) {
    if (z > 11) return;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const placed = [];
    for (const l of labels) {
      const px = l.size * z * (l.wide ? 0.34 : 0.26);
      if (px < 10 || l.n < 2 && px < 16) continue;
      const fs = Math.min(px, 64);
      const [sx, sy] = worldToScreen(l.x, l.y);
      if (sx < -200 || sx > W + 200 || sy < -50 || sy > H + 50) continue;
      const name = COUNTRY_BY_TAG[l.tag].name.toUpperCase();
      ctx.font = '600 ' + fs.toFixed(1) + 'px "Saira Stencil One", "Barlow Semi Condensed", sans-serif';
      const spacing = fs * 0.12;
      const w = ctx.measureText(name).width + spacing * name.length;
      if (w > l.size * z * 1.6 && fs > 14) continue;
      const box = [sx - w / 2, sy - fs / 2, sx + w / 2, sy + fs / 2];
      if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      placed.push(box);
      ctx.globalAlpha = Math.max(0, Math.min(1, (11 - z) / 3));
      ctx.fillStyle = 'rgba(18,16,12,0.62)';
      let x = sx - w / 2;
      for (const ch of name) { const cw = ctx.measureText(ch).width; ctx.fillText(ch, x + cw / 2, sy); x += cw + spacing; }
      ctx.globalAlpha = 1;
    }
  }

  function star(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath();
  }
  function drawCities(z) {
    const G = Sim.G;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const caps = G ? new Set(Object.values(G.countries).filter(c => c.alive).map(c => c.capital)) : null;
    const placedCity = [], starPts = [], dotPts = [];
    const order = cityOrder || (cityOrder = MAP.provs.filter(p => p.city).sort((a, b) => b.pop - a.pop));
    const sorted = caps ? order.slice().sort((a, b) => caps.has(b.id) - caps.has(a.id)) : order.slice().sort((a, b) => b.capital - a.capital);
    for (const p of sorted) {
      const isCap = caps ? caps.has(p.id) : p.capital;
      if (!isCap && z < 9) continue;
      if (isCap && z < 2.2) continue;
      const [sx, sy] = worldToScreen(p.x, p.y);
      if (sx < -40 || sx > W + 40 || sy < -20 || sy > H + 20) continue;
      (isCap ? starPts : dotPts).push(sx, sy);
      if ((isCap && z > 4.5) || z > 13) {
        ctx.font = (isCap ? '600 13px' : '500 12px') + ' "Barlow Semi Condensed", sans-serif';
        const w = ctx.measureText(p.city).width;
        const box = [sx + 6, sy - 8, sx + 10 + w, sy + 8];
        if (placedCity.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
        placedCity.push(box);
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(16,16,12,0.85)'; ctx.strokeText(p.city, sx + 8, sy);
        ctx.fillStyle = '#f1ead2'; ctx.fillText(p.city, sx + 8, sy);
      }
    }
    ctx.beginPath();
    for (let i = 0; i < dotPts.length; i += 2) { ctx.moveTo(dotPts[i] + 2.6, dotPts[i + 1]); ctx.arc(dotPts[i], dotPts[i + 1], 2.6, 0, Math.PI * 2); }
    ctx.fillStyle = '#e8dfc2'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#1b1a14'; ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < starPts.length; i += 2) {
      const cx = starPts[i], cy = starPts[i + 1];
      for (let k = 0; k < 10; k++) { const an = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 2.7 : 6; const px = cx + Math.cos(an) * rr, py = cy + Math.sin(an) * rr; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath();
    }
    ctx.fillStyle = '#efe6c8'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#1b1a14'; ctx.stroke();
    if (z > 16) {
      ctx.font = 'italic 500 11px "Barlow Semi Condensed", sans-serif'; ctx.textAlign = 'center';
      for (const p of MAP.provs) {
        if (p.city) continue;
        const [sx, sy] = worldToScreen(p.x, p.y);
        if (sx < -40 || sx > W + 40 || sy < -20 || sy > H + 20) continue;
        ctx.fillStyle = 'rgba(20,18,12,0.55)'; ctx.fillText(p.name, sx, sy + 16);
      }
    }
  }

  function drawPaths(z) {
    const G = Sim.G;
    for (const a of G.armies) {
      if (a.owner !== G.player || !a.path.length) continue;
      const sel = state.selArmies.has(a.id);
      const pts = [armyPos(a), ...a.path.map(id => [MAP.provs[id].x, MAP.provs[id].y])].map(p => worldToScreen(p[0], p[1]));
      const col = a.order === 'attack' ? '214,82,64' : a.order === 'redeploy' ? '110,170,220' : a.order === 'retreat' ? '200,200,200' : '150,200,110';
      ctx.lineWidth = sel ? 4 : 2.5; ctx.strokeStyle = 'rgba(' + col + ',' + (sel ? 0.95 : 0.6) + ')';
      if (a.order === 'redeploy') ctx.setLineDash([6, 5]);
      ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]);
      const e = pts[pts.length - 1], s = pts[pts.length - 2];
      const ang = Math.atan2(e[1] - s[1], e[0] - s[0]), L = sel ? 14 : 10;
      ctx.beginPath(); ctx.moveTo(e[0], e[1]);
      ctx.lineTo(e[0] - Math.cos(ang - 0.45) * L, e[1] - Math.sin(ang - 0.45) * L);
      ctx.lineTo(e[0] - Math.cos(ang + 0.45) * L, e[1] - Math.sin(ang + 0.45) * L);
      ctx.closePath(); ctx.fillStyle = 'rgba(' + col + ',0.95)'; ctx.fill();
    }
    // offensive targets still ahead (army regrouping)
    for (const a of G.armies) {
      if (a.owner !== G.player || a.order !== 'attack' || a.path.length || a.target < 0 || a.target === a.prov) continue;
      const [sx, sy] = worldToScreen(...armyPos(a)), t = MAP.provs[a.target], [tx, ty] = worldToScreen(t.x, t.y);
      ctx.setLineDash([4, 6]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(214,82,64,0.7)';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  const SYM = {
    inf(x, y, w, h) { ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); },
    arm(x, y, w, h) { ctx.ellipse(x + w / 2, y + h / 2, w * 0.36, h * 0.3, 0, 0, Math.PI * 2); },
    mec(x, y, w, h) { SYM.inf(x, y, w, h); ctx.moveTo(x + w * 0.86, y + h / 2); ctx.ellipse(x + w / 2, y + h / 2, w * 0.36, h * 0.3, 0, 0, Math.PI * 2); },
    mot(x, y, w, h) { SYM.inf(x, y, w, h); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); },
    art(x, y, w, h) { ctx.moveTo(x + w / 2 + 2.2, y + h / 2); ctx.arc(x + w / 2, y + h / 2, 2.2, 0, Math.PI * 2); },
    rec(x, y, w, h) { ctx.moveTo(x, y + h); ctx.lineTo(x + w, y); },
    mar(x, y, w, h) { SYM.inf(x, y, w, h); ctx.moveTo(x + w * 0.2, y + h * 0.85); ctx.quadraticCurveTo(x + w / 2, y + h * 1.25, x + w * 0.8, y + h * 0.85); },
    par(x, y, w, h) { SYM.inf(x, y, w, h); ctx.moveTo(x + w * 0.2, y + h * 0.35); ctx.quadraticCurveTo(x + w / 2, y - h * 0.2, x + w * 0.8, y + h * 0.35); }
  };
  function mainType(a) {
    const cnt = {};
    for (const u of a.units) cnt[u.type] = (cnt[u.type] || 0) + (u.type === 'tanks' ? 2.5 : u.type === 'artillery' ? 0.5 : 1);
    return Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0] || 'infantry';
  }

  function drawArmies(z, vx0, vy0, vx1, vy1) {
    const G = Sim.G;
    counterHits = [];
    const byProv = new Map();
    for (const a of G.armies) {
      const [x, y] = armyPos(a);
      if (x < vx0 - 2 || x > vx1 + 2 || y < vy0 - 2 || y > vy1 + 2) continue;
      const k = a.prov;
      if (!byProv.has(k)) byProv.set(k, []); byProv.get(k).push(a);
    }
    const small = z < 3.2;
    const symbols = [];
    for (const [, list] of byProv) {
      list.sort((a, b) => (a.owner === G.player) - (b.owner === G.player));
      list.forEach((a, i) => {
        const [wx, wy] = armyPos(a);
        let [sx, sy] = worldToScreen(wx, wy);
        const c = COUNTRY_BY_TAG[a.owner];
        const mine = a.owner === G.player;
        const hostile = Sim.atWar(a.owner, G.player);
        if (small) {
          ctx.beginPath(); ctx.arc(sx, sy - i * 4, mine ? 3.4 : 2.6, 0, Math.PI * 2);
          ctx.fillStyle = c.color; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = hostile ? '#e04a3a' : mine ? '#f2e3a8' : '#111'; ctx.stroke();
          counterHits.push({ x: sx - 5, y: sy - i * 4 - 5, w: 10, h: 10, army: a });
          return;
        }
        const w = 44, h = 20;
        const x = sx - w / 2, y = sy - h / 2 - 8 - i * (h + 3);
        const sel = state.selArmies.has(a.id);
        // shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x + 1.5, y + 2, w, h);
        ctx.fillStyle = mine ? '#27301f' : hostile ? '#3a1d1a' : '#262626'; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = c.color; ctx.fillRect(x + 2, y + 2, 17, h - 7);
